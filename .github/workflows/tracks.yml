name: Update world tracks

# Monthly refresh of the world race-track list from OpenStreetMap, so changes to a circuit
# (new layout, re-surfaced corners mapped by volunteers) reach the app without anyone acting.
on:
  schedule:
    - cron: '17 3 1 * *' # 03:17 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: world-tracks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Rebuild track list from OpenStreetMap
        run: node scripts/build-tracks.mjs
      - name: Commit if anything changed
        id: commit
        run: |
          if git diff --quiet -- app/data/world-tracks.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "cars-map-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data/world-tracks.json
          git commit -m "chore: refresh world tracks from OpenStreetMap"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Redeploy the app
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
