<!-- Backup of the owner's original Cars Map prototype artifact (claude.ai/artifact/PGNhk5aETHXTg5Pa26fy4A), saved 2026-11-09. Reference only. -->
<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cars Map prototype</title>
<style>
:root{--land:#f1ecf8;--water:#b9d7f4;--park:#d3ebcf;--road:#fff;--label:#4b4663;--halo:#f1ecf8;--pill:#1d1b24;--pilltx:#fff;--sheet:#fff;--sheettx:#1d1b24;--line:#d9d4e4;--acc:#7b4dff;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--land:#25222f;--water:#1b344f;--park:#243a2a;--road:#3b3748;--label:#bdb6d2;--halo:#25222f;--pill:#34313f;--sheet:#1d1b24;--sheettx:#f2f0f7;--line:#3a3646;color-scheme:dark}}
:root[data-theme="dark"]{--land:#25222f;--water:#1b344f;--park:#243a2a;--road:#3b3748;--label:#bdb6d2;--halo:#25222f;--pill:#34313f;--sheet:#1d1b24;--sheettx:#f2f0f7;--line:#3a3646;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--land);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--sheettx);overflow:hidden}
#app{position:relative;height:100%;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%}
.lbl{font-size:10px;fill:var(--label);text-anchor:middle;font-weight:600}
.nm{font-size:10px;font-weight:700;fill:var(--sheettx);text-anchor:middle;paint-order:stroke;stroke:var(--halo);stroke-width:3px}
.bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.bob{animation:none}}
.flame{opacity:0;transform-box:fill-box;transform-origin:right center}
.flame.on{animation:pop .17s ease-out}
@keyframes pop{0%{opacity:1;transform:scale(.3)}55%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.15)}}
.tag{position:absolute;top:12px;left:12px;background:var(--pill);color:var(--pilltx);padding:8px 14px;border-radius:20px;font-size:13px;font-weight:700}
.tag small{font-weight:400;opacity:.75;margin-left:6px}
.bar{position:absolute;left:12px;right:12px;bottom:14px;display:flex;gap:10px;justify-content:space-between;align-items:center}
.btn{border:0;background:var(--pill);color:var(--pilltx);font:inherit;font-weight:700;font-size:15px;padding:14px 20px;border-radius:28px;cursor:pointer}
.btn:focus-visible,.seg button:focus-visible,.sw:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#sheet{position:absolute;left:0;right:0;bottom:0;background:var(--sheet);color:var(--sheettx);border-radius:22px 22px 0 0;padding:16px 16px 20px;transform:translateY(105%);transition:transform .25s;max-height:78%;overflow:auto;box-shadow:0 -6px 24px #0003}
#sheet.open{transform:none}
#sheet h2{margin:0 0 6px;font-size:17px}
#prev{display:block;width:210px;max-width:60%;margin:0 auto 6px}
.row{margin:10px 0}
.row p{margin:0 0 6px;font-size:13px;opacity:.8}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:none;color:inherit;font:inherit;font-size:13px;padding:7px 12px;border-radius:16px;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--acc);background:var(--acc);color:#fff}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--sheet);box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--acc)}
#toast{position:absolute;left:50%;top:56px;transform:translateX(-50%);background:var(--pill);color:var(--pilltx);padding:8px 14px;border-radius:14px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
<svg id="map" viewBox="0 0 400 700" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Sample map of Perth with friends shown as cars">
  <rect width="400" height="700" fill="var(--land)"/>
  <path d="M0 0H62Q40 150 56 300Q72 450 42 600L0 700Z" fill="var(--water)"/>
  <ellipse cx="120" cy="600" rx="62" ry="46" fill="var(--water)"/>
  <path d="M120 560Q160 520 195 540Q232 562 252 502Q280 440 335 470" fill="none" stroke="var(--water)" stroke-width="15" stroke-linecap="round"/>
  <ellipse cx="300" cy="130" rx="48" ry="30" fill="var(--park)"/><ellipse cx="150" cy="330" rx="34" ry="22" fill="var(--park)"/><ellipse cx="330" cy="610" rx="40" ry="26" fill="var(--park)"/>
  <g fill="none" stroke="var(--road)" stroke-width="3.5" stroke-linecap="round">
    <path d="M62 250L340 205"/><path d="M200 0L220 700"/><path d="M0 410L400 380"/><path d="M120 90L300 650"/><path d="M60 520L380 560"/>
  </g>
  <g fill="none" stroke-width="4.5" stroke-linecap="round">
    <path d="M203 330L211 470" stroke="#e53935"/><path d="M211 470L216 600" stroke="#f9a825"/>
    <path d="M140 232L260 213" stroke="#f9a825"/><path d="M280 392L380 384" stroke="#2e9e5b"/><path d="M135 140L168 270" stroke="#e53935"/>
  </g>
  <g class="lbl"><text x="105" y="190">Scarborough</text><text x="75" y="450">Cottesloe</text><text x="150" y="355">Wembley</text><text x="262" y="318">Bayswater</text><text x="245" y="445">Cloverdale</text><text x="335" y="520">Kalamunda</text><text x="320" y="95">Darlington</text><text x="250" y="640">Beckenham</text></g>
  <g id="cars"></g>
</svg>
<div class="tag">Cars Map<small>sample traffic</small></div>
<div id="toast" role="status"></div>
<div class="bar"><button class="btn" id="cust">Customise car</button><button class="btn" id="add">Add friends</button></div>
<section id="sheet" aria-label="Customise your car">
  <h2>Your car</h2>
  <svg id="prev" viewBox="-20 0 140 56" aria-hidden="true"></svg>
  <div class="row"><p>Paint</p><div class="seg" id="s-color"></div></div>
  <div class="row"><p>Rims</p><div class="seg" id="s-rim"></div></div>
  <div class="row"><p>Flame pops</p><div class="seg" id="s-pat"></div></div>
  <div class="row"><p>Every</p><div class="seg" id="s-int"></div></div>
  <button class="btn" id="done" style="margin-top:6px">Done</button>
</section>
</div>
<script>
var COLORS=[["Red","#e53935"],["Blue","#1e88e5"],["Yellow","#fdd835"],["Green","#2e9e5b"],["Purple","#8e44ad"],["Black","#1a1a1f"]];
var RIMS=[["5 spoke","five"],["Mesh","mesh"],["Deep dish","dish"]];
var PATS=[["Off","off"],["Single","single"],["Double","double"],["Triple","triple"]];
var INTS=[1,3,5];
var cars={
  you:{name:"You",color:"#1e88e5",rim:"five",pat:"double",int:3,x:196,y:366},
  sam:{name:"Sam",color:"#e53935",rim:"mesh",pat:"single",int:5,x:116,y:244},
  jess:{name:"Jess",color:"#8e44ad",rim:"dish",pat:"triple",int:3,x:276,y:160}
};
function wheel(cx,c,style){
  var s='<circle cx="'+cx+'" cy="42" r="11" fill="#17171a"/><circle cx="'+cx+'" cy="42" r="7.6" fill="#2a2a30"/>';
  if(style==="dish"){s+='<circle cx="'+cx+'" cy="42" r="6.6" fill="#cfd3d8"/><circle cx="'+cx+'" cy="42" r="3.4" fill="#9aa0a8"/>';}
  else{var n=style==="mesh"?14:5,w=style==="mesh"?.8:2;
    for(var i=0;i<n;i++){s+='<line x1="'+cx+'" y1="42" x2="'+cx+'" y2="35.4" stroke="#cfd3d8" stroke-width="'+w+'" transform="rotate('+(i*360/n)+' '+cx+' 42)"/>';}
    s+='<circle cx="'+cx+'" cy="42" r="1.9" fill="#cfd3d8"/>';}
  return s;
}
function carInner(c){
  return '<g data-car="'+c.id+'">'+
  '<g class="flame"><polygon points="8,40 -12,38 -3,42 -17,46 8,46" fill="#ff8a00"/><polygon points="8,41 -4,40 1,43 -5,45 8,45" fill="#ffe14d"/></g>'+
  '<path d="M6 40L8 29Q10 25 20 24L40 21Q48 8 64 8L82 8Q94 9 100 21L110 24Q116 27 116 35L116 40Z" fill="'+c.color+'"/>'+
  '<path d="M45 21Q51 12 64 12L80 12Q88 13 92 21Z" fill="#cde6f7"/><path d="M68 12L68 21" stroke="'+c.color+'" stroke-width="1.5"/>'+
  '<rect x="108" y="29" width="7" height="4" rx="1.5" fill="#fff3b0"/>'+
  wheel(30,c,c.rim)+wheel(90,c,c.rim)+'</g>';
}
function render(){
  var h="",k,i=0;
  for(k in cars){var c=cars[k];c.id=k;
    h+='<g class="bob" style="animation-delay:-'+(i++*1.1)+'s"><svg x="'+(c.x-35)+'" y="'+c.y+'" width="70" height="28" viewBox="-20 0 140 56" overflow="visible">'+carInner(c)+'</svg>'+
       '<text class="nm" x="'+c.x+'" y="'+(c.y+40)+'">'+c.name+'</text></g>';}
  document.getElementById("cars").innerHTML=h;
  document.getElementById("prev").innerHTML=carInner(cars.you);
}
function pop(k){
  var n={single:1,double:2,triple:3}[cars[k].pat]||0;
  for(var i=0;i<n;i++)setTimeout(function(){
    document.querySelectorAll('[data-car="'+k+'"] .flame').forEach(function(f){f.classList.remove("on");void f.getBBox();f.classList.add("on");});
  },i*190);
}
var timers={};
function schedule(k){
  clearInterval(timers[k]);
  if(cars[k].pat==="off")return;
  timers[k]=setInterval(function(){pop(k)},cars[k].int*1000);
  pop(k);
}
function seg(id,items,key,swatch){
  var box=document.getElementById(id);box.innerHTML="";
  items.forEach(function(it){
    var v=Array.isArray(it)?it[1]:it,t=Array.isArray(it)?it[0]:it+" sec";
    var b=document.createElement("button");b.type="button";
    if(swatch){b.className="sw";b.style.background=v;b.setAttribute("aria-label",t);}else b.textContent=t;
    b.setAttribute("aria-pressed",cars.you[key]===v);
    b.onclick=function(){cars.you[key]=v;render();schedule("you");seg(id,items,key,swatch);};
    box.appendChild(b);
  });
}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},2200);}
seg("s-color",COLORS,"color",true);seg("s-rim",RIMS,"rim");seg("s-pat",PATS,"pat");seg("s-int",INTS,"int");
var sheet=document.getElementById("sheet");
document.getElementById("cust").onclick=function(){sheet.classList.add("open")};
document.getElementById("done").onclick=function(){sheet.classList.remove("open")};
document.getElementById("add").onclick=function(){toast("Friend invites come in the full app")};
render();for(var k in cars)schedule(k);
</script>
</body>
</html>
